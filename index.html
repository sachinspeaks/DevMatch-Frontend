<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary -->
    <title>DevMatch — Find developers worth building with</title>
    <meta
      name="description"
      content="DevMatch connects you with developers who share your stack, your interests, and your appetite for shipping. Free to join. No résumé, no recruiters."
    />
    <meta name="author" content="DevMatch" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#dc2626" />
    <link rel="canonical" href="https://devmatch.example.com/" />

    <!-- Open Graph (Facebook, LinkedIn, Slack, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DevMatch" />
    <meta property="og:url" content="https://devmatch.example.com/" />
    <meta
      property="og:title"
      content="DevMatch — Find developers worth building with"
    />
    <meta
      property="og:description"
      content="Swipe through developers who share your stack and your appetite for shipping. Match, connect, and start building."
    />
    <meta
      property="og:image"
      content="https://devmatch.example.com/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A DevMatch profile card showing a developer's stack and interests"
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="DevMatch — Find developers worth building with"
    />
    <meta
      name="twitter:description"
      content="Swipe through developers who share your stack and your appetite for shipping. Match, connect, and start building."
    />
    <meta
      name="twitter:image"
      content="https://devmatch.example.com/og-image.png"
    />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "DevMatch",
        "url": "https://devmatch.example.com/",
        "description": "DevMatch connects you with developers who share your stack, your interests, and your appetite for shipping.",
        "applicationCategory": "SocialNetworkingApplication",
        "operatingSystem": "Web",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
